[project]
name = "ssts-backend"
version = "0.1.0"
description = "A face recognition based attendance api."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "face-recognition>=1.3.0",
    "flask>=3.1.1",
    "numpy>=2.3.2",
    "pathlib>=1.0.1",
    "psycopg2>=2.9.10",
    "python-dotenv>=1.1.1",
    "setuptools>=80.9.0",
]

[tool.uv.sources]
face-recognition-models = { git = "https://github.com/ageitgey/face_recognition_models" }
